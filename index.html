<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Exam Simulator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <!-- Optional direct local data load for file:// scheme without web server -->
    <script src="exam_data.js"></script>

    <style>
        :root {
            --bg-main: #0d1117;
            --bg-surface: #161b22;
            --bg-hover: #21262d;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #ff7b72;
            --bg-blue-muted: rgba(88, 166, 255, 0.12);
            --bg-green-muted: rgba(63, 185, 80, 0.1);
            --bg-red-muted: rgba(255, 123, 114, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            max-width: 860px;
            margin: 0 auto;
            padding: 30px 20px 60px;
            line-height: 1.6;
        }

        /* SVG Icon helper */
        svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* --- Sidebar Backdrop & Drawer --- */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 380px;
            max-width: 88vw;
            height: 100vh;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 35px rgba(0, 0, 0, 0.6);
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #12161d;
        }

        .sidebar-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .sidebar-title svg {
            color: var(--accent-blue);
        }

        .sidebar-close-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .sidebar-close-btn:hover {
            color: #ffffff;
            background-color: var(--bg-hover);
            border-color: var(--border-color);
        }

        .sidebar-subtext {
            padding: 12px 24px;
            font-size: 13px;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(48, 54, 61, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-body {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lecture-card {
            background-color: #0f131a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
            position: relative;
        }

        .lecture-card:hover {
            border-color: var(--accent-blue);
            background-color: #161c26;
            transform: translateY(-2px);
        }

        .lecture-card.active {
            border-color: var(--accent-blue);
            background-color: var(--bg-blue-muted);
            box-shadow: inset 3px 0 0 var(--accent-blue);
        }

        .lecture-card-title {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .lecture-card-title .active-pill {
            font-size: 11px;
            background: var(--accent-blue);
            color: #0d1117;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .lecture-card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
        }

        .lecture-card-stats {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .stat-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
        }

        .stat-badge.in-progress {
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent-blue);
        }

        .stat-badge.completed {
            background: var(--bg-green-muted);
            color: var(--accent-green);
        }

        .sidebar-footer {
            padding: 18px 20px;
            border-top: 1px solid var(--border-color);
            background-color: #12161d;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .import-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background-color: var(--bg-surface);
            color: var(--text-main);
            border: 1px dashed var(--border-color);
            padding: 11px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.2s;
        }

        .import-btn:hover {
            border-color: var(--accent-blue);
            color: #ffffff;
            background-color: var(--bg-hover);
        }

        .sidebar-footer-hint {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
            text-align: center;
        }

        .sidebar-footer-hint code {
            color: #e6edf3;
            background: #21262d;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 11px;
        }

        /* --- Toolbelt Layout --- */
        .toolbelt {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            position: sticky;
            top: 16px;
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .lecture-switcher-btn {
            display: flex;
            align-items: center;
            gap: 9px;
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            flex-shrink: 0;
            max-width: 240px;
        }

        .lecture-switcher-btn:hover {
            border-color: var(--accent-blue);
            color: #ffffff;
            background-color: #2a313c;
        }

        .lecture-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }
        
        .progress-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 140px;
        }

        .progress-text {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            min-width: 60px;
            white-space: nowrap;
        }

        .progress-bar-bg {
            flex-grow: 1;
            background-color: var(--border-color);
            height: 8px;
            border-radius: 4px;
            cursor: pointer;
            position: relative; 
        }

        .progress-bar-fill {
            background-color: var(--accent-blue);
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .stats {
            display: flex;
            gap: 16px;
            flex-shrink: 0;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 15px;
        }

        .correct-text { color: var(--accent-green); }
        .incorrect-text { color: var(--accent-red); }

        /* --- Question Area --- */
        .question-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 20px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .q-number {
            flex-shrink: 0;
            color: var(--text-muted);
            font-weight: 600;
        }
        
        .question-image { 
            display: block; 
            margin: 0 auto 24px auto; 
            min-width: 140px;
            max-width: min(90%, 480px); 
            height: auto;
            max-height: 280px;
            border-radius: 8px;
            background: transparent;
            padding: 6px;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.5));
        }



        /* --- Options --- */
        .option-btn {
            display: flex;
            align-items: flex-start;
            width: 100%;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 12px;
            color: var(--text-main);
            font-size: 16px;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .option-btn:hover:not(:disabled) {
            border-color: #8b949e;
            background-color: #1f242c;
            transform: translateY(-2px);
        }

        .opt-letter {
            font-weight: 600;
            color: var(--text-muted);
            width: 35px;
            flex-shrink: 0;
            padding-top: 2px;
        }
        .opt-text { flex-grow: 1; padding-top: 2px; }
        .opt-icon { width: 24px; flex-shrink: 0; display: flex; justify-content: flex-end; }

        /* --- Feedback States --- */
        .option-btn.correct { border-color: var(--accent-green); background-color: var(--bg-green-muted); }
        .option-btn.correct .opt-letter { color: var(--accent-green); }
        
        .option-btn.incorrect { border-color: var(--accent-red); background-color: var(--bg-red-muted); }
        .option-btn.incorrect .opt-letter { color: var(--accent-red); }
        
        .option-btn.dimmed { opacity: 0.4; }
        .option-btn:disabled { cursor: default; pointer-events: none; }

        /* --- Navigation Buttons --- */
        .nav-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid var(--border-color);
        }

        button.nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.2s;
        }

        button.nav-btn:hover:not(:disabled) { 
            background-color: #30363d; 
            border-color: #8b949e; 
        }

        /* --- Text / Essay Question Styles --- */
        .text-answer-block {
            width: 100%;
            margin-top: 10px;
        }

        .text-input-group {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 100%;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 4px 6px 4px 16px;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .text-input-group:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.18);
        }

        .essay-input {
            flex: 1 1 0;
            min-width: 0;
            width: 0;
            background: transparent;
            border: none;
            outline: none;
            font-size: 16px;
            font-family: inherit;
            color: var(--text-main);
            padding: 12px 0;
            box-sizing: border-box;
        }

        .essay-input::placeholder {
            color: var(--text-muted);
            opacity: 0.85;
        }

        .essay-send-btn {
            background-color: var(--accent-blue);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            width: 40px;
            height: 40px;
            min-width: 40px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            margin-left: 8px;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .essay-send-btn:hover {
            filter: brightness(1.15);
            transform: scale(1.04);
        }

        .essay-send-btn:active {
            transform: scale(0.96);
        }

        .essay-send-btn svg {
            width: 19px;
            height: 19px;
            stroke: #ffffff;
            stroke-width: 2.6;
            fill: none;
            pointer-events: none;
        }


        /* Result box matches standard .option-btn exactly */
        .essay-result-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            border-radius: 10px;
            padding: 16px 20px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .essay-result-box.correct {
            border: 1px solid var(--accent-green);
            background-color: var(--bg-green-muted);
            color: var(--accent-green);
            font-weight: 500;
        }

        .essay-result-box.incorrect {
            border: 1px solid var(--accent-red);
            background-color: var(--bg-red-muted);
            color: var(--accent-red);
            font-weight: 500;
        }

        .essay-result-text {
            word-break: break-word;
        }

        .essay-correct-hint {
            margin-top: 12px;
            margin-left: 4px;
            font-size: 15px;
            color: var(--text-muted);
            animation: fadeIn 0.25s ease-out;
        }

        .essay-correct-hint b {
            color: var(--accent-green);
            font-weight: 600;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .shake {
            animation: shake 0.35s ease-in-out;
            border-color: var(--accent-red) !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Empty / Error State --- */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background-color: var(--bg-surface);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .empty-state h3 {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .empty-state p {
            color: var(--text-muted);
            max-width: 460px;
            margin: 0 auto 24px;
            font-size: 14px;
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 640px) {
            body {
                padding: 16px 12px 40px;
            }
            .toolbelt {
                padding: 10px 14px;
                gap: 12px;
                margin-bottom: 20px;
                flex-wrap: wrap;
            }
            .lecture-switcher-btn {
                max-width: 100%;
                width: 100%;
                justify-content: space-between;
                order: 1;
            }
            .progress-wrapper {
                order: 2;
                flex-basis: 60%;
            }
            .stats {
                order: 3;
                gap: 12px;
            }
            .question-header {
                font-size: 17px; 
                margin-bottom: 18px;
            }
            .option-btn {
                font-size: 14px; 
                padding: 12px 16px;
            }
            .opt-letter {
                width: 25px;
            }
            .stat-item {
                font-size: 14px;
            }
            .text-input-group {
                padding: 4px 6px 4px 14px;
            }
            .essay-send-btn {
                width: 38px;
                height: 38px;
                min-width: 38px;
                min-height: 38px;
                margin-left: 6px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Overlay & Drawer -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar(false)"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                <span>Quizzes</span>
            </div>
            <button class="sidebar-close-btn" onclick="toggleSidebar(false)" title="Close (Esc)">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>

        <div class="sidebar-body" id="lecture-list">
            <!-- Dynamically populated lecture cards -->
        </div>

        <div class="sidebar-footer">
            <label class="import-btn">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <span>Import .txt File on the fly</span>
                <input type="file" id="txt-file-input" accept=".txt" style="display:none" onchange="handleFileUpload(event)">
            </label>
        </div>
    </aside>

    <!-- Sticky Top Toolbelt -->
    <div class="toolbelt">
        <!-- Lecture selector button -->
        <button class="lecture-switcher-btn" id="btn-lecture-menu" onclick="toggleSidebar(true)" title="Switch lecture / question set (Shortcut: M)">
            <svg viewBox="0 0 24 24" style="width: 17px; height: 17px; flex-shrink: 0;"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            <span class="lecture-title-text" id="current-lecture-label">Select Lecture</span>
            <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; flex-shrink: 0; opacity: 0.6;"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>

        <div class="progress-wrapper">
            <div class="progress-text"><span id="q-current">1</span> / <span id="q-total">?</span></div>
            <div class="progress-bar-bg" id="progress-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-item correct-text" title="Correct answers">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                <span id="score-correct">0</span>
            </div>
            <div class="stat-item incorrect-text" title="Incorrect answers">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                <span id="score-incorrect">0</span>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div id="exam-container"></div>

    <!-- Navigation Buttons -->
    <div class="nav-buttons">
        <button class="nav-btn" id="btn-prev" onclick="prevQuestion()">
            <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back
        </button>
        <button class="nav-btn" id="btn-next" onclick="nextQuestion()">
            Next
            <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
    </div>

    <script>
        // State variables
        let allExams = [];         // List of all available exam sets
        let activeExam = null;     // Currently selected exam object
        let originalExamData = []; // Unshuffled copy of active exam questions
        let examData = [];         // Working (shuffled) questions
        let currentIndex = 0;
        let userAnswers = {};
        let draftAnswers = {};     // Persists unsubmitted typed text across question navigation
        let stats = { correct: 0, incorrect: 0 };

        // Clean SVG icons for UI
        const svgCheck = `<svg viewBox="0 0 24 24" style="color: var(--accent-green)"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
        const svgX = `<svg viewBox="0 0 24 24" style="color: var(--accent-red)"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;

        // Shuffle helper
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Toggle Sidebar - only opens if more than 1 question file exists
        function toggleSidebar(forceOpen) {
            if (allExams.length <= 1 && forceOpen !== false) return;
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const isOpen = sidebar.classList.contains('active');
            const shouldOpen = (typeof forceOpen === 'boolean') ? forceOpen : !isOpen;

            if (shouldOpen) {
                sidebar.classList.add('active');
                overlay.classList.add('active');
            } else {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            }
        }

        // Keyboard navigation & shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                if (e.key === 'Enter' && e.target.id === 'text-answer-field') {
                    e.preventDefault();
                    submitTextAnswer();
                }
                return;
            }

            if (e.key === 'Escape') {
                toggleSidebar(false);
            } else if (e.key === 'm' || e.key === 'M') {
                if (allExams.length > 1) {
                    toggleSidebar();
                }
            } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
                const nextBtn = document.getElementById('btn-next');
                if (nextBtn && !nextBtn.disabled && document.querySelector('.nav-buttons').style.display !== 'none') {
                    nextQuestion();
                }
            } else if (e.key === 'ArrowLeft') {
                const prevBtn = document.getElementById('btn-prev');
                if (prevBtn && !prevBtn.disabled && document.querySelector('.nav-buttons').style.display !== 'none') {
                    prevQuestion();
                }
            }
        });


        // Initialize exam sets
        function initExams(rawExams) {
            if (!rawExams || rawExams.length === 0) {
                showEmptyState("No question sets found. Place .txt files in the folder and run 'python builder.py'.");
                return;
            }

            allExams = rawExams;

            // Show sidebar toggle button ONLY if there is more than 1 exam file
            const menuBtn = document.getElementById('btn-lecture-menu');
            if (menuBtn) {
                menuBtn.style.display = (allExams.length > 1) ? 'flex' : 'none';
            }

            renderSidebarList();

            // Check if there is a saved active exam id
            const lastActiveId = localStorage.getItem('examSimulatorActiveId');
            let chosenExam = allExams.find(e => e.id === lastActiveId) || allExams[0];

            selectExam(chosenExam.id);
        }

        // Render the list of lectures in the sidebar
        function renderSidebarList() {
            const listContainer = document.getElementById('lecture-list');
            listContainer.innerHTML = '';

            allExams.forEach(exam => {
                const card = document.createElement('div');
                card.className = `lecture-card ${activeExam && activeExam.id === exam.id ? 'active' : ''}`;
                card.id = `card-${exam.id}`;
                card.onclick = () => selectExam(exam.id);

                // Check stored stats for this exam
                const savedStateStr = localStorage.getItem(`examSimulatorState_${exam.id}`);
                let statsSnippet = '';
                if (savedStateStr) {
                    try {
                        const savedState = JSON.parse(savedStateStr);
                        const answeredCount = Object.keys(savedState.userAnswers || {}).length;
                        const total = (savedState.examData || []).length || exam.count;
                        if (answeredCount > 0) {
                            if (answeredCount >= total && total > 0) {
                                const pct = ((savedState.stats.correct / total) * 100).toFixed(0);
                                statsSnippet = `<span class="stat-badge completed">Score: ${pct}%</span>`;
                            } else {
                                statsSnippet = `<span class="stat-badge in-progress">${answeredCount}/${total} Answered</span>`;
                            }
                        }
                    } catch (e) { }
                }

                card.innerHTML = `
                    <div class="lecture-card-title">
                        <span>${exam.title}</span>
                        ${activeExam && activeExam.id === exam.id ? '<span class="active-pill">ACTIVE</span>' : ''}
                    </div>
                    <div class="lecture-card-meta">
                        <span>${exam.count} question${exam.count !== 1 ? 's' : ''}</span>
                        <div class="lecture-card-stats">${statsSnippet}</div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // Switch to a chosen exam
        function selectExam(examId) {
            // Save state of previous exam if one was active
            if (activeExam) {
                saveProgress();
            }

            const target = allExams.find(e => e.id === examId);
            if (!target) return;

            activeExam = target;
            localStorage.setItem('examSimulatorActiveId', examId);
            document.getElementById('current-lecture-label').innerText = activeExam.title;

            // Make sure toolbelt & nav buttons are visible
            document.querySelector('.nav-buttons').style.display = 'flex';
            document.querySelector('.toolbelt').style.display = 'flex';

            originalExamData = target.questions || [];

            // Check if there is saved progress for this specific exam
            const savedStateStr = localStorage.getItem(`examSimulatorState_${examId}`);
            if (savedStateStr) {
                try {
                    const state = JSON.parse(savedStateStr);
                    examData = state.examData && state.examData.length > 0 ? state.examData : [...originalExamData];
                    currentIndex = state.currentIndex || 0;
                    userAnswers = state.userAnswers || {};
                    draftAnswers = state.draftAnswers || {};
                    stats = state.stats || { correct: 0, incorrect: 0 };
                } catch (e) {
                    examData = [...originalExamData];
                    shuffleArray(examData);
                    currentIndex = 0;
                    userAnswers = {};
                    draftAnswers = {};
                    stats = { correct: 0, incorrect: 0 };
                }
            } else {
                examData = [...originalExamData];
                shuffleArray(examData);
                currentIndex = 0;
                userAnswers = {};
                draftAnswers = {};
                stats = { correct: 0, incorrect: 0 };
            }

            // Ensure valid index
            if (currentIndex >= examData.length) currentIndex = 0;

            document.getElementById('q-total').innerText = examData.length;
            renderSidebarList();
            toggleSidebar(false);
            renderQuestion();
        }

        // Save progress for current exam into localStorage
        function saveProgress() {
            if (!activeExam) return;
            const state = {
                examData: examData,
                currentIndex: currentIndex,
                userAnswers: userAnswers,
                draftAnswers: draftAnswers,
                stats: stats
            };
            localStorage.setItem(`examSimulatorState_${activeExam.id}`, JSON.stringify(state));
        }

        // Save unsubmitted draft for current question before navigating away
        function saveCurrentDraft() {
            const input = document.getElementById('text-answer-field');
            if (input && userAnswers[currentIndex] === undefined) {
                draftAnswers[currentIndex] = input.value;
                saveProgress();
            }
        }

        // Text / Essay Question Helpers
        function isTextQuestion(q) {
            return q && (q.type === 'text' || !q.options || q.options.length === 0);
        }

        function isTextAnswerCorrect(userAns, correctAns) {
            if (!userAns || !correctAns) return false;
            const cleanUser = userAns.trim().toLowerCase();
            // Supports comma or slash separated alternatives (e.g., "oxirane / ethylene oxide")
            const validOptions = correctAns.split(/[/,]/).map(a => a.trim().toLowerCase()).filter(Boolean);
            return validOptions.includes(cleanUser) || cleanUser === correctAns.trim().toLowerCase();
        }

        function submitTextAnswer() {
            if (userAnswers[currentIndex] !== undefined) return;
            const input = document.getElementById('text-answer-field');
            if (!input) return;
            const val = input.value.trim();
            if (!val) {
                input.focus();
                const group = document.getElementById('text-input-group');
                if (group) {
                    group.classList.add('shake');
                    setTimeout(() => group.classList.remove('shake'), 400);
                }
                return;
            }

            userAnswers[currentIndex] = val;
            delete draftAnswers[currentIndex];
            const q = examData[currentIndex];
            if (isTextAnswerCorrect(val, q.answer)) {
                stats.correct++;
            } else {
                stats.incorrect++;
            }

            renderQuestion();
            setTimeout(() => { 
                const nextBtn = document.getElementById('btn-next');
                if (nextBtn) nextBtn.focus();
                document.querySelector('.nav-buttons').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); 
            }, 250);
        }


        // Render current question
        function renderQuestion() {
            const container = document.getElementById('exam-container');
            if (!examData || examData.length === 0) {
                showEmptyState("No questions found in this set.");
                return;
            }

            const q = examData[currentIndex];
            const hasAnswered = userAnswers[currentIndex] !== undefined;

            document.getElementById('q-current').innerText = currentIndex + 1;
            document.getElementById('score-correct').innerText = stats.correct;
            document.getElementById('score-incorrect').innerText = stats.incorrect;

            const progressPct = ((currentIndex + 1) / examData.length) * 100;
            document.getElementById('progress-fill').style.width = `${progressPct}%`;

            document.getElementById('btn-prev').disabled = (currentIndex === 0);

            const btnNext = document.getElementById('btn-next');
            if (currentIndex === examData.length - 1) {
                btnNext.innerHTML = `Finish Exam <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; margin-left: 6px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
            } else {
                btnNext.innerHTML = `Next <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; margin-left: 4px;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
            }

            let html = `
            <div class="question-header">
                <div class="q-number">${currentIndex + 1}.</div>
                <div class="q-text">${q.question}</div>
            </div>`;

            if (q.image) { 
                html += `<img src="${q.image}" class="question-image" alt="Question Diagram">`; 
            }

            if (isTextQuestion(q)) {
                const userVal = hasAnswered ? (userAnswers[currentIndex] || '') : '';
                const isCorrect = hasAnswered ? isTextAnswerCorrect(userVal, q.answer) : false;

                if (hasAnswered) {
                    if (isCorrect) {
                        html += `
                        <div class="text-answer-block">
                            <div class="essay-result-box correct">
                                <span class="essay-result-text">${userVal}</span>
                                <div class="opt-icon">${svgCheck}</div>
                            </div>
                        </div>`;
                    } else {
                        html += `
                        <div class="text-answer-block">
                            <div class="essay-result-box incorrect">
                                <span class="essay-result-text">${userVal}</span>
                                <div class="opt-icon">${svgX}</div>
                            </div>
                            <div class="essay-correct-hint">
                                Correct answer: <b>${q.answer}</b>
                            </div>
                        </div>`;
                    }
                } else {
                    const draftVal = draftAnswers[currentIndex] || '';
                    html += `
                    <div class="text-answer-block">
                        <div class="text-input-group" id="text-input-group">
                            <input 
                                type="text" 
                                id="text-answer-field" 
                                class="essay-input" 
                                placeholder="Type your answer..." 
                                value="${draftVal.replace(/"/g, '&quot;')}"
                                autocomplete="off" 
                                autocorrect="off" 
                                autocapitalize="off" 
                                spellcheck="false"
                                oninput="draftAnswers[currentIndex] = this.value; saveProgress();"
                                onkeydown="if(event.key === 'Enter') submitTextAnswer()"
                            >
                            <button class="essay-send-btn" id="btn-submit-text" onclick="submitTextAnswer()" title="Submit (Enter)">
                                <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                            </button>
                        </div>
                    </div>`;
                }
            } else if (q.options) {
                q.options.forEach((opt, index) => {
                    let cssClass = "option-btn";
                    let iconHtml = `<div class="opt-icon"></div>`;

                    let match = opt.match(/^([A-D]\))\s*(.*)/);
                    let letter = match ? match[1] : '';
                    let text = match ? match[2] : opt;

                    if (hasAnswered) {
                        const isCorrect = opt.startsWith(q.answer);
                        const isSelected = userAnswers[currentIndex] === opt;

                        if (isCorrect) {
                            cssClass += " correct";
                            iconHtml = `<div class="opt-icon">${svgCheck}</div>`;
                        } else if (isSelected && !isCorrect) {
                            cssClass += " incorrect";
                            iconHtml = `<div class="opt-icon">${svgX}</div>`;
                        } else {
                            cssClass += " dimmed";
                        }
                    }

                    html += `
                    <button class="${cssClass}" onclick="selectAnswer(${index})" ${hasAnswered ? 'disabled' : ''}>
                        <div class="opt-letter">${letter}</div>
                        <div class="opt-text">${text}</div>
                        ${iconHtml}
                    </button>`;
                });
            }

            container.innerHTML = html;

            if (isTextQuestion(q) && !hasAnswered) {
                setTimeout(() => {
                    const input = document.getElementById('text-answer-field');
                    if (input) input.focus();
                }, 50);
            }

            if (window.renderMathInElement) {
                renderMathInElement(container, {
                    delimiters: [
                        {left: "$$", right: "$$", display: true},
                        {left: "$", right: "$", display: false}
                    ],
                    throwOnError: false
                });
            }

            saveProgress();
        }

        function selectAnswer(optIndex) {
            const q = examData[currentIndex];
            const selectedOpt = q.options[optIndex];

            userAnswers[currentIndex] = selectedOpt;
            if (selectedOpt.startsWith(q.answer)) {
                stats.correct++;
            } else {
                stats.incorrect++;
            }

            renderQuestion();
            setTimeout(() => { 
                document.querySelector('.nav-buttons').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); 
            }, 300);
        }

        function nextQuestion() {
            saveCurrentDraft();
            if (currentIndex < examData.length - 1) {
                currentIndex++;
                renderQuestion();
                window.scrollTo({top: 0, behavior: 'smooth'});
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            saveCurrentDraft();
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        }

        function showResults() {
            const answeredCount = Object.keys(userAnswers).length;
            const unansweredCount = examData.length - answeredCount;
            const percentage = examData.length > 0 ? ((stats.correct / examData.length) * 100).toFixed(1) : 0;
            const color = percentage >= 60 ? 'var(--accent-green)' : 'var(--accent-red)';

            // Hide the buttons AND the toolbelt
            document.querySelector('.nav-buttons').style.display = 'none';
            document.querySelector('.toolbelt').style.display = 'none';

            const container = document.getElementById('exam-container');
            container.innerHTML = `
                <div style='text-align: center; padding: 48px 24px; background-color: var(--bg-surface); border-radius: 12px; border: 1px solid var(--border-color); margin-top: 10px;'>
                    <span style='font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-blue); font-weight: 600;'>${activeExam.title}</span>
                    <h2 style='color: var(--text-main); margin: 6px 0 12px; font-weight: 600;'>Exam Complete</h2>
                    <h1 style='color: ${color}; font-size: 64px; font-weight: 700; margin: 0;'>${percentage}%</h1>
                    <p style='color: var(--text-muted); font-size: 16px; margin-top: 5px; margin-bottom: 40px;'>Final Score</p>
                    
                    <div style='display: flex; justify-content: center; gap: 40px; margin-bottom: 45px;'>
                        <div style='color: var(--accent-green); display: flex; flex-direction: column; align-items: center;'>
                            <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; margin-bottom: 8px;"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            <span style='font-size: 14px; margin-bottom: 4px;'>Correct</span>
                            <b style='font-size: 24px;'>${stats.correct}</b>
                        </div>
                        <div style='color: var(--accent-red); display: flex; flex-direction: column; align-items: center;'>
                            <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; margin-bottom: 8px;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            <span style='font-size: 14px; margin-bottom: 4px;'>Incorrect</span>
                            <b style='font-size: 24px;'>${stats.incorrect}</b>
                        </div>
                        <div style='color: var(--text-muted); display: flex; flex-direction: column; align-items: center;'>
                            <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; margin-bottom: 8px;"><circle cx="12" cy="12" r="10"></circle><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                            <span style='font-size: 14px; margin-bottom: 4px;'>Skipped</span>
                            <b style='font-size: 24px;'>${unansweredCount}</b>
                        </div>
                    </div>

                    <div style='display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;'>
                        <button class="nav-btn" onclick="retakeExam(false)" style="background-color: var(--bg-green-muted); color: var(--accent-green); border-color: var(--accent-green);">
                            <svg viewBox="0 0 24 24" style="width: 16px; height: 16px;"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                            Retake Entire Exam
                        </button>
                        ${(stats.incorrect > 0 || unansweredCount > 0) ? `
                        <button class="nav-btn" onclick="retakeExam(true)" style="background-color: var(--bg-red-muted); color: var(--accent-red); border-color: var(--accent-red);">
                            <svg viewBox="0 0 24 24" style="width: 16px; height: 16px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            Retake Missed / Skipped
                        </button>` : ''}
                        ${allExams.length > 1 ? `
                        <button class="nav-btn" onclick="toggleSidebar(true)" style="background-color: var(--bg-blue-muted); color: var(--accent-blue); border-color: var(--accent-blue);">
                            <svg viewBox="0 0 24 24" style="width: 16px; height: 16px;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                            Select Another Quiz
                        </button>` : ''}
                    </div>
                </div>
            `;
            window.scrollTo({top: 0, behavior: 'smooth'});
            saveProgress();
            renderSidebarList();
        }

        function retakeExam(onlyIncorrect) {
            if (onlyIncorrect) {
                examData = examData.filter((q, index) => {
                    const ans = userAnswers[index];
                    if (!ans) return true;
                    if (isTextQuestion(q)) {
                        return !isTextAnswerCorrect(ans, q.answer);
                    }
                    return !ans.startsWith(q.answer);
                });
                shuffleArray(examData);
            } else {
                examData = [...originalExamData];
                shuffleArray(examData);
            }

            currentIndex = 0;
            userAnswers = {};
            draftAnswers = {};
            stats = { correct: 0, incorrect: 0 };

            document.querySelector('.nav-buttons').style.display = 'flex';
            document.querySelector('.toolbelt').style.display = 'flex';
            document.getElementById('q-total').innerText = examData.length;

            renderQuestion();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function showEmptyState(message) {
            document.querySelector('.nav-buttons').style.display = 'none';
            document.getElementById('exam-container').innerHTML = `
                <div class="empty-state">
                    <h3>No Questions Ready</h3>
                    <p>${message}</p>
                    ${allExams.length > 1 ? `<button class="nav-btn" style="margin: 0 auto;" onclick="toggleSidebar(true)">Open Quizzes</button>` : ''}
                </div>
            `;
        }

        // --- In-Browser Text File Parser (Direct Import) ---
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const parsedQuestions = parseRawText(text);

                if (parsedQuestions.length === 0) {
                    alert("Could not find any questions in this file. Make sure they start with '### Question'.");
                    return;
                }

                const baseName = file.name.replace(/\.[^/.]+$/, "").replace(/_/g, " ");
                const newId = "imported_" + Date.now();

                const newExam = {
                    id: newId,
                    title: baseName,
                    filename: file.name,
                    count: parsedQuestions.length,
                    questions: parsedQuestions
                };

                // Add to list and select it
                allExams.unshift(newExam);
                const menuBtn = document.getElementById('btn-lecture-menu');
                if (menuBtn) {
                    menuBtn.style.display = (allExams.length > 1) ? 'flex' : 'none';
                }
                selectExam(newId);
                event.target.value = '';
            };
            reader.readAsText(file, 'utf-8');
        }

        function parseRawText(rawText) {
            const lines = rawText.split(/\r?\n/);
            const questions = [];
            let current_q = null;
            let options = [];

            for (let line of lines) {
                const line_clean = line.trim();
                if (!line_clean) continue;

                if (/^###\s+Question/i.test(line_clean)) {
                    if (current_q) {
                        current_q.options = options;
                        current_q.type = options.length > 0 ? 'mcq' : 'text';
                        questions.push(current_q);
                    }
                    current_q = { question: '', answer: '', image: null, type: 'mcq' };
                    options = [];
                } else if (line_clean.startsWith("IMAGE:")) {
                    if (current_q) current_q.image = line_clean.split("IMAGE:")[1].trim();
                } else if (/^[A-D]\)/.test(line_clean)) {
                    options.push(line_clean);
                } else if (line_clean.startsWith("Answer:")) {
                    if (current_q) current_q.answer = line_clean.split("Answer:")[1].trim();
                } else if (current_q !== null) {
                    const cleaned = line_clean.replace(/^###\s*/, '');
                    if (current_q.question === '') {
                        current_q.question = cleaned;
                    } else {
                        current_q.question += ' ' + cleaned;
                    }
                }
            }

            if (current_q) {
                current_q.options = options;
                current_q.type = options.length > 0 ? 'mcq' : 'text';
                questions.push(current_q);
            }

            return questions;
        }


        // --- Interactive Progress Scrubber ---
        const progressBg = document.getElementById('progress-bg');
        const progressFill = document.getElementById('progress-fill');
        const qCurrentText = document.getElementById('q-current');
        
        let isDraggingProgress = false;
        let dragIndex = 0;

        function updateProgressUIOnly(e) {
            if (!examData || examData.length === 0) return;

            const rect = progressBg.getBoundingClientRect();
            let clientX = 0;
            if (e.type.includes('mouse')) {
                clientX = e.clientX;
            } else if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
            } else {
                return;
            }

            let clickX = clientX - rect.left;
            clickX = Math.max(0, Math.min(clickX, rect.width));
            
            const percentage = clickX / rect.width;
            dragIndex = Math.floor(percentage * examData.length);
            if (dragIndex >= examData.length) dragIndex = examData.length - 1;

            progressFill.style.transition = 'none';
            progressFill.style.width = `${((dragIndex + 1) / examData.length) * 100}%`;
            qCurrentText.innerText = dragIndex + 1;
        }

        function finalizeDrag() {
            if (!isDraggingProgress) return;
            isDraggingProgress = false;
            progressFill.style.transition = 'width 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
            
            saveCurrentDraft();
            if (currentIndex !== dragIndex) {
                currentIndex = dragIndex;
                renderQuestion();
            } else {
                renderQuestion();
            }
        }

        progressBg.addEventListener('mousedown', (e) => {
            isDraggingProgress = true;
            updateProgressUIOnly(e);
        });
        window.addEventListener('mousemove', (e) => {
            if (isDraggingProgress) updateProgressUIOnly(e);
        });
        window.addEventListener('mouseup', finalizeDrag);

        progressBg.addEventListener('touchstart', (e) => {
            isDraggingProgress = true;
            updateProgressUIOnly(e);
        }, {passive: true});
        window.addEventListener('touchmove', (e) => {
            if (isDraggingProgress) updateProgressUIOnly(e);
        }, {passive: true});
        window.addEventListener('touchend', finalizeDrag);

        // --- Data Loading Strategy ---
        // 1. If exam_data.js loaded via script tag (native offline file:// support):
        if (window.EXAM_DATABASE && window.EXAM_DATABASE.exams) {
            initExams(window.EXAM_DATABASE.exams);
        } else {
            // 2. Fetch exam_data.json as a fallback (HTTP server):
            fetch('exam_data.json', { cache: 'no-store' })
                .then(response => response.json())
                .then(data => {
                    if (data.exams && Array.isArray(data.exams)) {
                        initExams(data.exams);
                    } else if (Array.isArray(data)) {
                        // Compatibility with old single array format
                        initExams([{
                            id: "default_exam",
                            title: "Default Lecture",
                            filename: "test_exam.txt",
                            count: data.length,
                            questions: data
                        }]);
                    } else {
                        showEmptyState("No valid exam format detected in exam_data.json.");
                    }
                })
                .catch(err => {
                    console.warn("Could not load exam data via fetch:", err);
                    showEmptyState("Could not load questions. Run 'python builder.py' or import a .txt file below.");
                });
        }
    </script>
</body>
</html>
